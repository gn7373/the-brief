name: Update NU events

on:
  schedule:
    # Runs every night at 6:00 AM UTC (~1 AM Chicago time). Adjust as you like:
    # cron syntax is "minute hour day month weekday".
    - cron: '0 6 * * *'
  workflow_dispatch:  # lets you trigger it manually from the GitHub Actions tab

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run scraper
        run: python nu_events_scraper.py

      - name: Commit updated events.json if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add events.json
          git diff --quiet --cached || git commit -m "Auto-update events.json"
          git push
